AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Data Catalog API — FastAPI CRUD service for table metadata, packaged for
  AWS Lambda behind an HTTP API (API Gateway v2).

Parameters:
  Stage:
    Type: String
    Default: prod
    Description: API Gateway deployment stage name.
  MongoUri:
    Type: String
    NoEcho: true
    Description: >
      MongoDB connection string (e.g. a MongoDB Atlas SRV URI). Passed as a
      Lambda environment variable — for a real production rollout, prefer
      storing this in AWS Secrets Manager and resolving it at cold start
      instead of passing it as a plain CloudFormation parameter.
  MongoDbName:
    Type: String
    Default: data_catalog
  MongoCollection:
    Type: String
    Default: metadata
  CognitoDomainPrefix:
    Type: String
    Description: >
      Globally-unique prefix for the Cognito Hosted UI domain (used to reach
      the /oauth2/token endpoint). E.g. "data-catalog-<your-account-id>".

Globals:
  Function:
    Runtime: python3.12
    Timeout: 29 # API Gateway's own integration timeout caps at 29s regardless of the function's own limit
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  DataCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler.handler
      Environment:
        Variables:
          MONGO_URI: !Ref MongoUri
          MONGO_DB_NAME: !Ref MongoDbName
          MONGO_COLLECTION: !Ref MongoCollection
          # AUTH_ISSUER != "dev" switches app/core/security.py from the local
          # dev keypair to verifying against this User Pool's JWKS instead.
          AUTH_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${DataCatalogUserPool}"
          AUTH_JWKS_URL: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${DataCatalogUserPool}/.well-known/jwks.json"
          # Not set: Cognito *access* tokens (unlike ID tokens) carry a
          # `client_id` claim rather than a standard `aud` -- validating a
          # specific audience here would need a small addition to
          # verify_token() (SDD's "not implemented" list, section 3).
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DataCatalogHttpApi
            Path: $default
            Method: ANY
      # If MongoDB is only reachable from inside a VPC (self-hosted on EC2,
      # or Amazon DocumentDB), uncomment and fill in VpcConfig — this also
      # requires the execution role to have ec2:CreateNetworkInterface
      # permissions (AWSLambdaVPCAccessExecutionRole).
      # VpcConfig:
      #   SecurityGroupIds:
      #     - sg-xxxxxxxx
      #   SubnetIds:
      #     - subnet-xxxxxxxx
      #     - subnet-yyyyyyyy

  DataCatalogHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # No Authorizer here on purpose: a single catch-all route can't apply
      # one selectively to write methods only, and applying it to
      # everything would also block the public GET routes. Enforcement
      # happens in the FastAPI dependency layer instead -- see
      # docs/sdd-api-authentication.md, section 6.1.

  # Issuer of the JWTs the API verifies (app/core/security.py). Provisioned
  # here as a token source only -- no Authorizer wired to it (see above).
  DataCatalogUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]

  DataCatalogUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref DataCatalogUserPool

  # Human callers: Authorization Code grant (e.g. via the Hosted UI).
  DataCatalogHumanClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: data-catalog-human
      UserPoolId: !Ref DataCatalogUserPool
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - http://localhost:8000/docs/oauth2-redirect

  # Cognito's Client Credentials grant only works with custom scopes tied to
  # a Resource Server -- standard OIDC scopes (openid/email/profile) are
  # rejected for this flow, unlike the human client above.
  DataCatalogResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref DataCatalogUserPool
      Identifier: catalog
      Name: Data Catalog API
      Scopes:
        - ScopeName: write
          ScopeDescription: Create/update/delete table metadata

  # Machine callers (e.g. scripts/glue_emulator/sync.py, once adjusted --
  # see docs/sdd-api-authentication.md, section 7): Client Credentials grant.
  DataCatalogServiceClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: DataCatalogResourceServer
    Properties:
      ClientName: data-catalog-service
      UserPoolId: !Ref DataCatalogUserPool
      GenerateSecret: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [catalog/write]

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API
    Value: !Sub "https://${DataCatalogHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
  FunctionName:
    Description: Lambda function name
    Value: !Ref DataCatalogFunction
  CognitoTokenEndpoint:
    Description: OAuth2 token endpoint (client-credentials grant for machine callers)
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  CognitoServiceClientId:
    Description: App client ID for machine callers (client_credentials grant)
    Value: !Ref DataCatalogServiceClient
